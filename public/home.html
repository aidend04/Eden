<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Include Tailwind CSS -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <style>
            /* Hamburger menu bar transformations */
            .bar1 {
                transform-origin: top left;
            }

            .bar2 {
                opacity: 1;
                transform-origin: center;
            }

            .bar3 {
                transform-origin: bottom left;
            }

            .open .bar1 {
                transform: translateY(-1px) rotate(45deg);
                background-color: whitesmoke;
                z-index: 100;
            }

            .open .bar2 {
                opacity: 0;
            }

            .open .bar3 {
                transform: translateY(1px) rotate(-45deg);
                background-color: whitesmoke;
                z-index: 1;
            }

            /* Menu container transitions */
            .menu-ctr {
                transition: opacity 0.3s ease, visibility 0.3s ease;
                opacity: 0;
                visibility: hidden;
            }

            .menu-ctr.show {
                opacity: 1;
                visibility: visible;
            }
        </style>
    </head>

    <body class="relative overflow-hidden">

        <!-- Message of the Day Section -->
        <div class="absolute top-0 left-0 right-0 h-1/2 flex flex-col items-center justify-center pt-20">
            <h1 class="text-4xl">MOTD</h1>
            <p class="text-2xl">Message of the day</p>
        </div>

        <!-- Hamburger Menu Button -->
        <div class="absolute top-0 right-0 m-4">
            <button title="Menu Button" id="menu-btn" class="relative w-10 h-10 focus:outline-none mr-6">
                <div class="bar bar1 absolute w-full h-1 bg-black rounded-full transform transition duration-300"></div>
                <div class="bar bar2 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-3">
                </div>
                <div class="bar bar3 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-6">
                </div>
            </button>
        </div>

        <!-- Main Application Grid -->
        <div id="app" class="grid grid-cols-3 gap-4 items-center justify-center h-screen p-4">
            <!-- Expenses Section -->
            <div
                class="flex flex-col h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto relative text-xl px-2">
                Expenses
                <div class="absolute top-0 right-0 mr-2">
                    <div class="arrow">&gt;</div>
                </div>
                <div class="text-center w-full flex-grow mt-8">
                    <span id="month" class="block mx-auto"></span>
                </div>
            </div>
            <!-- Monthly Outlook Section -->
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Monthly Outlook</div>
            <!-- Graphs Section -->
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Graphs</div>
        </div>

        <!-- Menu Container -->
        <div id="menu-ctr"
            class="absolute top-0 left-0 p-8 w-full h-full bg-black bg-opacity-70 flex items-center justify-center">
            <div
                class="flex w-3/4 h-3/5 min-h-[275px] overflow-y-auto m-auto p-4 bg-white rounded-md shadow-md items-center justify-center">
                <ul class="text-black w-full">
                    <!-- Home Section -->
                    <li class="mb-4">
                        <div id="home">
                            Home
                            <ul class="ml-4">
                                <li>Dashboard</li>
                                <li>Expenses</li>
                                <li>Monthly Outlook</li>
                                <li>Graphs</li>
                            </ul>
                        </div>
                    </li>
                    <div class="border-b border-gray-300 my-4"></div>
                    <!-- Settings Section -->
                    <li class="mb-4">
                        <div>
                            Settings
                            <ul class="ml-4">
                                <li>Profile</li>
                                <li>Preferences</li>
                                <li>Logout</li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <script>
            // Change app theme based on the time of day
            let app = document.getElementById('app');
            let hour = new Date().getHours();
            if (hour < 6 || hour >= 18)
            {
                app.classList.add('bg-gray-900', 'text-white');
            } else
            {
                app.classList.add('bg-white', 'text-black');
            }

            // Set the current month
            let monthElement = document.getElementById('month');
            let monthAbbreviations = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            let currentMonth = new Date().getMonth();
            monthElement.textContent = monthAbbreviations[currentMonth];

            // Toggle menu visibility
            document.getElementById('menu-btn').addEventListener('click', function ()
            {
                this.classList.toggle('open');
                let menu = document.getElementById('menu-ctr');
                menu.classList.toggle('show');
            });
        </script>
    </body>

</html>
