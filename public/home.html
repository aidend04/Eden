<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Add Tailwind CSS -->
    <meta name="viewport" content="width=device-width">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/home-day.css">
    
</head>

<body>
    <div id="topText" class="flex relative justify-between items-center mx-1 sm:mx-1 md:mx-2 lg:mx-3 xl:mx-4 2xl:mx-5">
        <h1 class="text-sm sm:text-sm md:text-base lg:text-lg xl:text-xl 2xl:text-2xl truncate">Welcome to your Eden,</h1>
        <button id="add-btn" class="relative w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 lg:w-12 lg:h-12 focus:outline-none flex items-center justify-center transition duration-300">
            <span class="text-3xl sm:text-3xl md:text-4xl lg:text-5xl">+</span>
        </button>
    </div>
    <div id="backdrop-exp" class="popup-backdrop">
        <form id="expense-form" class="absolute top-0 left-0 p-8 w-full h-full bg-black bg-opacity-70 z-50 flex items-center justify-center">
            <div class="form-content">
                <div id="overlay"></div>
                <h1 id="expense-form-title" class="text-center mb-4">Create Expense</h1>
                <div class="form-grid">
                    <div>
                        <label for="amount">Amount:</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0">

                        <label for="category">Category:</label>
                        <select id="category" name="category">
                            <option value="">Select a category</option>
                            <option value="Dining Out">Dining Out</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Subscriptions">Subscriptions</option>
                            <option value="Rent">Rent</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Amazon">Amazon</option>
                            <option value="Misc">Misc</option>
                        </select>

                        <label for="description">Description:</label>
                        <input type="text" id="description" name="description" maxlength="20">
                        <small class="form-text text-muted">Max 20 characters</small>
                    </div>
                    <div>
                        <label for="date">Date:</label>
                        <input type="date" id="date" name="date">

                        <label for="userPaid">Paid By:</label>
                        <select id="userPaid" name="userPaid"></select>

                        <label for="userPay">Users Owing:</label>
                        <span id="userPay" class="checkbox-grid"></span>
                    </div>
                </div>
                <div class="form-row mt-4">
                    <label for="recurring" style="line-height: 1;">Make this a recurring expense? <br> <small class="text-muted">(From Today)</small></label>
                    <input id="recurring" type="checkbox">
                    <select id="recur_options" class="hidden mt-4">
                        <option value="">Select an option</option>
                        <option value="daily">daily</option>
                        <option value="weekly">weekly</option>
                        <option value="bi-weekly">biweekly</option>
                        <option value="monthly">monthly</option>
                        <option value="annually">annually</option>
                    </select>
                </div>
                <div class="form-row mt-4">
                    <label for="split">How would you like to split this expense?</label>
                    <label id="evenly" class="mr-2">evenly<span id="evenly-text" class="tooltip">Please enter amount</span></label>
                    <label id="bar" class="mr-2">|</label>
                    <label id="custom">custom<span id="custom-text" class="tooltip"><div class="close-btn">&times;</div><br><p id="amountTotal"></p><p id="amountRemaining"></p><br></span></label>
                </div>
                <input type="submit" value="Submit" class="mt-4">
                <p id="missing-field" class="text-red-500 mt-2"></p>
            </div>
        </form>
    </div>


    <div id="expensesDiv" class="expenses flex flex-col justify-between rounded-xl col-span-1 bg-gray-200 p-4 relative h-auto mb-4" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <div>
            <div class="flex justify-between items-center">
                <h2>Expenses</h2>
            </div>
            <div class="month-text text-center w-full mt-4">
                <select id="month" class="mx-auto">
                    <option value="JAN">JAN</option>
                    <option value="FEB">FEB</option>
                    <option value="MAR">MAR</option>
                    <option value="APR">APR</option>
                    <option value="MAY">MAY</option>
                    <option value="JUN">JUN</option>
                    <option value="JUL">JUL</option>
                    <option value="AUG">AUG</option>
                    <option value="SEP">SEP</option>
                    <option value="OCT">OCT</option>
                    <option value="NOV">NOV</option>
                    <option value="DEC">DEC</option>
                </select>
            </div>
        </div>
        <div class="mt-4">
            <label for="select-expenseType" class="text-sm ml-4">Filter by:</label>
            <select id="select-expenseType" class="bg-transparent text-sm ml-2">
                <option value="all">all</option>
                <option value="paid">paid</option>
                <option value="unpaid">unpaid</option>
                <option value="recurring">recurring</option>
            </select>
            <label for="select-category" class="text-sm ml-4">Category:</label>
            <select id="select-category" name="category" class="bg-transparent text-sm ml-2">
                <option value="all">all</option>
                <option value="Dining Out">Dining Out</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Groceries">Groceries</option>
                <option value="Subscriptions">Subscriptions</option>
                <option value="Rent">Rent</option>
                <option value="Utilities">Utilities</option>
                <option value="Amazon">Amazon</option>
                <option value="Misc">Misc</option>
            </select>
        </div>
        <div id="expense-add" class="text-center w-full flex mb-4 overflow-y-auto" style="align-items: center; width: 415px;">
        </div>
    </div>
    
    <div id="app" class="grid grid-cols-1 lg:grid-cols- gap-4">
        <div class="flex flex-col space-y-4">
            <div id="graph" class="rounded-xl p-4" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <!-- Placeholder for the graph -->
            </div>
            <div id="monthlyAvgGraph" class="rounded-xl p-4" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <!-- Placeholder for the monthly average graph -->
            </div>
        </div>
        <div class="flex flex-col space-y-4">
            <div id="table-container" class="rounded-xl p-4" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <!-- Placeholder for the table -->
            </div>
            <div id="expenseUpload" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <h1 style="color: #3D3B2A; font-weight: bold; font-size: large;">Upload Expenses</h1>
                <form action="/expense/upload"  method="post" enctype="multipart/form-data">
                    <input type="file" name="myFiles" id="fileInput" accept=".jpg, .jpeg, .png" multiple style="margin-top: 10px;"/>
                    <button id="uploadExpenseBtn" style="background-color: #6B705C; color: #FFF; padding: 10px 20px; border: none; border-radius: 5px; margin-top: 10px;">Upload</button>
                    <h4 style="color: #3D3B2A; font-weight: bold; font-size: x-small;">*Please note: supported types include: .jpg, .jpeg, .png</h4>
                </form>
            </div>
        </div>

    
        <div class="flex flex-col space-y-4">
            <div id="myBudget" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <div class="flex justify-between"><h1 style="color: #3D3B2A; font-weight: bold; font-size: large;">MyBudget</h1>
                    <button id="create-budg">create</button></div>
                    <div id="budgContent" style="height: 220px; width: 100%;">Please create your budget...</div>
                    <div id="cre-back" class="popup-backdrop">
                        <div id="edit-details" class="stylish-container">
                            <h2>Expense Categories</h2>
                            <div id='form-group' class="form-group">
                                <label for="dining-out">Dining Out:</label>
                                <input type="number" id="dining-out" name="dining-out" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="entertainment">Entertainment:</label>
                                <input type="number" id="entertainment" name="entertainment" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="groceries">Groceries:</label>
                                <input type="number" id="groceries" name="groceries" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="subscriptions">Subscriptions:</label>
                                <input type="number" id="subscriptions" name="subscriptions" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="rent">Rent:</label>
                                <input type="number" id="rent" name="rent" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="utilities">Utilities:</label>
                                <input type="number" id="utilities" name="utilities" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="amazon">Amazon:</label>
                                <input type="number" id="amazon" name="amazon" value="0" data-prev-value="0">
                            </div>
                            <div class="form-group">
                                <label for="misc">Misc:</label>
                                <input type="number" id="misc" name="misc" value="0" data-prev-value="0">
                            </div>
                            <div class="total-container">
                                <hr>
                                <label id="totalBudg">Total: $0.00</label>
                            </div>
                        </div>
                    </div>
            </div>

            <div id="myAccount" style="padding: 20px; background-color: #EFEAD8; border: 1px solid #CCC; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <div class="flex justify-between"><h1 style="color: #3D3B2A; font-weight: bold; font-size: large;">myAccount</h1>
                    <button id="logout">logout</button></div>
                    <div id="inviteDiv" style="padding: 10px;">

                        <h2 style="color: #3D3B2A; font-weight: bold; font-size: large;">myInvite</h2> 
                        <input id="invite" type="text" placeholder="Please enter invitee email" style="width: 300px; margin-top: 2px;">
                        <button id="inviteBtn" style="background-color: #6B705C; color: #FFF; padding: 5px 20px; border: none; border-radius: 5px; margin-top: 10px;">send</button>
                    </div>
                    
            </div>
        </div>
      

        
    </div>
    

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="home.js"></script>
</body>

</html>
