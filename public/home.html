<!DOCTYPE html>
<html lang="en">

    <head>
        <!-- Add Tailwind CSS -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <style>
            .expenses {
                display: flex;
                justify-content: space-between;
                position: relative;
                padding: 0 10px;
                font-size: 1.5em;
            }

            .arrow-container {
                position: absolute;
                top: 0;
                right: 0;
            }

            #month {
                display: block;
                text-align: center;
                margin-top: 2em;
            }

            .bar {
                transition: transform 0.3s, opacity 0.3s;
            }

            .bar1 {
                transform-origin: top left;
            }

            .bar2 {
                opacity: 1;
                transform-origin: center;
            }

            .bar3 {
                transform-origin: bottom left;
            }

            .open .bar1 {
                transform: translateY(-1px) rotate(45deg);
                background-color: whitesmoke;
                z-index: 100;
            }

            .open .bar2 {
                opacity: 0;
            }

            .open .bar3 {
                transform: translateY(1px) rotate(-45deg);
                background-color: whitesmoke;
                z-index: 1;
            }

            .menu-ctr {
                transition: opacity 0.3s ease, visibility 0.3s ease;
                opacity: 0;
                visibility: hidden;
            }

            .menu-ctr.show {
                opacity: 1;
                visibility: visible;
            }

            .menu {
                display: flex;
                width: 75%;
                height: 60%;
                min-height: 275px;
                overflow-y: auto;
                margin: auto;
                padding: 1rem;
                background-color: white;
                border-radius: 0.5rem;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                align-items: center;
                justify-content: center;
            }

            .menu-item {
                margin-bottom: 1rem;
            }

            .menu-divider {
                border-bottom: 1px solid #e5e7eb;
                margin: 1rem 0;
            }
        </style>
    </head>

    <body class="relative overflow-hidden">
        <!-- Add a div on top of the app div -->
        <div class="absolute top-0 left-0 right-0 h-1/2">
            <h1 class="text-block text-4xl text-center pt-20">MOTD</h1>
            <p class="text-block text-2xl text-center">Message of the day</p>
        </div>
        <div class="absolute top-0 right-0 m-4">
            <button id="menu-btn" class="relative w-10 h-10 focus:outline-none mr-6">
                <div class="bar bar1 absolute w-full h-1 bg-black rounded-full transform transition duration-300"></div>
                <div class="bar bar2 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-3">
                </div>
                <div class="bar bar3 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-6">
                </div>
            </button>
        </div>
        <div id="app" class="grid grid-cols-3 gap-4 items-center justify-center h-screen p-4">
            <div class="expenses flex flex-col h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">
                Expenses
                <div class="arrow-container absolute top-0 right-0 mr-2">
                    <div class="arrow">></div>
                </div>
                <div class="month-text text-center w-full flex-grow">
                    <span id="month" class="mx-auto"></span>
                </div>
            </div>
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Monthly Outlook</div>
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Graphs</div>
        </div>

        <div id="menu-ctr"
            class="absolute top-0 left-0 p-8 w-full h-full bg-black bg-opacity-70 menu-ctr flex items-center justify-center">
            <!-- Add menu content here -->
            <div class="menu">
                <ul class="text-black">
                    <li class="menu-item">
                        <div id="home">
                            Home
                            <ul class="ml-4">
                                <li>Dashboard</li>
                                <li>Expenses</li>
                                <li>Monthly Outlook</li>
                                <li>Graphs</li>
                            </ul>
                        </div>
                    </li>
                    <div class="menu-divider"></div>
                    <li class="menu-item">
                        <div>
                            Settings
                            <ul class="ml-4">
                                <li>Profile</li>
                                <li>Preferences</li>
                                <li>Logout</li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>

        <script>
            let app = document.getElementById('app');
            let hour = new Date().getHours();

            if (hour < 6 || hour >= 18)
            {
                // Night time
                app.classList.add('dark');
                app.classList.add('text-white');
            } else
            {
                // Day time
                app.classList.add('light');
                app.classList.add('text-black');
            }

            let monthElement = document.getElementById('month');
            let monthAbbreviations = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            let currentMonth = new Date().getMonth();
            monthElement.textContent = monthAbbreviations[currentMonth];

            document.getElementById('menu-btn').addEventListener('click', function ()
            {
                this.classList.toggle('open');
                let menu = document.getElementById('menu-ctr');
                menu.classList.toggle('show');
            });
        </script>
    </body>

</html>
