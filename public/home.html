<!DOCTYPE html>
<html>
    <head>
        <!-- Add Tailwind CSS -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <style>
        .expenses {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 0 10px;
            font-size: 1.5em;
        }
        .arrow-container {
            position: absolute;
            top: 0;
            right: 0;
        }
        #month {
            display: block;
            text-align: center;
            margin-top: 2em;
        }
        .bar {
            transition: transform 0.3s, opacity 0.3s;
        }

        .bar1 {
            transform-origin: top left;
        }

        .bar2 {
            opacity: 1;
            transform-origin: center;
        }

        .bar3 {
            transform-origin: bottom left;
        }

        .open .bar1 {
            transform: translateY(-1px) rotate(45deg);
        }

        .open .bar2 {
            opacity: 0;
        }

        .open .bar3 {
            transform: translateY(1px) rotate(-45deg);
        }

        .open .menu-ctr {
            display: absolute;
        }
        </style>
</head>

    <body>
        <!-- add a div ontop of app div -->
        <div class="absolute top-0 left-0 right-0 h-1/2">
            <h1 class="text-block text-4xl text-center pt-20">MOTD</h1>
            <p class="text-block text-2xl text-center">Message of the day</p>
        </div>
        <div class="absolute top-0 right-0 m-4">
            <button id="menu-btn" class="relative w-10 h-10 focus:outline-none mr-6">
                <div class="bar bar1 absolute w-full h-1 bg-black rounded-full transform transition duration-300"></div>
                <div class="bar bar2 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-3">
                </div>
                <div class="bar bar3 absolute w-full h-1 bg-black rounded-full transform transition duration-300 mt-6">
                </div>
            </button>
        </div>
        <div id="app" class="grid grid-cols-3 gap-4 items-center justify-center h-screen p-4">
            <div class="expenses flex flex-col h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">
            Expenses
            <div class="arrow-container absolute top-0 right-0 mr-2">
                <div class="arrow">></div>
            </div>
            <div class="month-text text-center w-full flex-grow">
                <span id="month" class="mx-auto"></span>
            </div>
        </div>
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Monthly Outlook</div>
            <div class="h-1/2 rounded-xl col-span-1 row-span-2 bg-gray-200 overflow-auto">Graphs</div>
        </div>

        <div id="menu-ctr" class="hidden top-0 left-0 p-8 w-full h-full bg-black z-1">
            
        </div>



    <script>
        let app = document.getElementById('app');
        let hour = new Date().getHours();

        if (hour < 6 || hour >= 18) {
            // Night time
            app.classList.add('dark');
            app.classList.add('text-white');
        } else {
            // Day time
            app.classList.add('light');
            app.classList.add('text-black');
        }

        let monthElement = document.getElementById('month');
        let monthAbbreviations = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        let currentMonth = new Date().getMonth();
        monthElement.textContent = monthAbbreviations[currentMonth];

        document.getElementById('menu-btn').addEventListener('click', function ()
            {
                this.classList.toggle('open');
            });
    </script>
</body>
</html>
